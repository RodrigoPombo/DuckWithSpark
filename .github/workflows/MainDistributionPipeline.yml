#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.4
    with:
      duckdb_version: v1.4.4
      ci_tools_version: v1.4.4
      extension_name: spark_duckdb

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.4.4
    with:
      duckdb_version: v1.4.4
      ci_tools_version: v1.4.4
      extension_name: spark_duckdb
      format_checks: 'format;tidy'

  github-release:
    name: Publish GitHub Release
    needs:
      - duckdb-stable-build
      - code-quality-check
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.duckdb-stable-build.result == 'success' && needs.code-quality-check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: spark_duckdb-v1.4.4-extension-*
          path: ./artifacts
          merge-multiple: false

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find ./artifacts -name '*.duckdb_extension' -print0 | while IFS= read -r -d '' file; do
            artifact_dir=$(basename "$(dirname "$file")")
            platform_dir="release-assets/${artifact_dir}"
            mkdir -p "$platform_dir"
            cp "$file" "$platform_dir/spark_duckdb.duckdb_extension"
            (cd release-assets && zip -q -j "${artifact_dir}.zip" "${artifact_dir}/spark_duckdb.duckdb_extension")
            rm -rf "$platform_dir"
          done
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
